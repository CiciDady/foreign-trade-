[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ftagents"
version = "0.1.0"
description = "外贸最小闭环:选品 + 合规 + 利润测算 多 Agent 协同原型"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ftagents = "ftagents.cli:main"
ftagents-web = "ftagents.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ftagents = ["data/*.json", "static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
